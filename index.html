<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100909" />
    <title>Um convite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="stage">
      <div class="sunset" aria-hidden="true"></div>
      <div class="sun" aria-hidden="true"></div>
      <div class="sea sea-back" aria-hidden="true"></div>
      <div class="sea sea-front" aria-hidden="true"></div>
      <img class="sticker sticker-rose" src="/stickers/sticker-heart.webp" alt="" aria-hidden="true" />
      <img class="sticker sticker-leon" src="/stickers/sticker-leon.png" alt="" aria-hidden="true" />

      <section class="invitation" aria-live="polite">
        <div class="mark" aria-hidden="true"><span></span><i></i><span></span></div>
        <div class="mask" aria-hidden="true"><b></b><b></b><em></em></div>
        <h1>Vamos sair<br />juntos?</h1>
        <p class="question">Quer ver o pôr do sol na praia comigo?</p>

        <div class="choices" id="choices">
          <button class="yes" id="yesButton" type="button">Simmm, vamos!</button>
          <button class="no" id="noButton" type="button" aria-label="Não (esta resposta está indisponível)">Não, eu te odeio</button>
        </div>

      </section>

      <section class="answer" id="answer" hidden>
        <div class="rose" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
        <h2>Ebaa<br />então vamos juntos.</h2>
        <p>A gente pode levar algumas coisinhas pra praia e ver o pôr do sol juntos, e depois tomar algum drink</p>
        <img class="phantom-photo" src="/images/phantom-of-the-opera.png" alt="Cena em preto e branco de O Fantasma da Ópera" />
      </section>
      <audio id="bodySong" autoplay preload="auto" src="/music/mother-mother-body.m4a"></audio>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
